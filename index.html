<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14111d">
  <meta name="description" content="2026년 11월 19일부터 GTA 6 PC버전을 기다린 시간을 기록합니다.">
  <title>GTA 6 PC버전 기다리는 중</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>
      <time datetime="2026-11-19T00:00:00+09:00">2026년 11월 19일부터</time>
      <span class="elapsed" role="timer" aria-live="off">
        <span><b id="days">0</b>일</span>
        <span><b id="hours">0</b>시간</span>
        <span><b id="minutes">0</b>분</span>
        <span><b id="seconds">0</b>초째</span>
      </span>
      <span class="title"><span>GTA 6 PC버전</span> 기다리는 중</span>
      <span class="zone">한국 표준시 기준 (KST)</span>
      <noscript><span class="no-script">카운터를 보려면 JavaScript를 켜 주세요.</span></noscript>
    </h1>
    <figure class="art">
      <img src="./gamer-at-desk.webp" width="1536" height="1024" alt="게이밍 헤드셋을 쓰고 책상 앞에 턱을 괸 채 따분한 표정으로 모니터를 바라보는 남자">
    </figure>
  </main>
  <script>
    const startedAt = Date.parse(document.querySelector("time").dateTime);
    const days = document.getElementById("days");
    const hours = document.getElementById("hours");
    const minutes = document.getElementById("minutes");
    const seconds = document.getElementById("seconds");
    let nextTick;

    function renderCounter() {
      const now = Date.now();
      const elapsed = Math.max(0, Math.floor((now - startedAt) / 1000));

      days.textContent = Math.floor(elapsed / 86400).toLocaleString("ko-KR");
      hours.textContent = Math.floor(elapsed / 3600) % 24;
      minutes.textContent = Math.floor(elapsed / 60) % 60;
      seconds.textContent = elapsed % 60;

      clearTimeout(nextTick);
      nextTick = setTimeout(renderCounter, 1000 - (now % 1000));
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) renderCounter();
    });
    window.addEventListener("pageshow", renderCounter);
    renderCounter();
  </script>
</body>
</html>
